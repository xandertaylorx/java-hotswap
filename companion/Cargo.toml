[package]
name = "java-hotswap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Java HotSwap project runner and Zed launch adapter"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
roxmltree = "0.20"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
