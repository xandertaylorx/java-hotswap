name: Verify
on: [push, pull_request]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        java: ['17', '21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        if: matrix.java == '25'
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.java == '25'
        run: echo "JAVA_HOTSWAP_TEST_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: cargo fmt --check && cargo fmt --manifest-path companion/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path companion/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked && cargo test --locked --manifest-path companion/Cargo.toml
      - run: cargo build --locked --manifest-path companion/Cargo.toml
      - run: python3 tests/e2e.py -v
      - run: cargo build --locked --release --target wasm32-wasip2
