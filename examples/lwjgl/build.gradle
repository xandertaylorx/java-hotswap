plugins { id 'application' }
repositories { mavenCentral() }
def os = System.getProperty('os.name').toLowerCase()
def arch = System.getProperty('os.arch').toLowerCase()
def natives = os.contains('mac') ? (arch.contains('aarch64') || arch.contains('arm64') ? 'natives-macos-arm64' : 'natives-macos') : os.contains('win') ? 'natives-windows' : 'natives-linux'
dependencies {
    implementation platform('org.lwjgl:lwjgl-bom:3.3.6')
    for (module in ['lwjgl', 'lwjgl-glfw']) {
        implementation "org.lwjgl:${module}"
        runtimeOnly "org.lwjgl:${module}::${natives}"
    }
}
application {
    mainClass = 'demo.Main'
    if (os.contains('mac')) applicationDefaultJvmArgs = ['-XstartOnFirstThread']
}
